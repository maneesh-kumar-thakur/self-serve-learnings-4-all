name: Validate catalog

# Fast, deterministic structural check. Runs on every PR (so it can be a required
# status check) and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalog structure
        run: node scripts/validate.mjs
