name: Link check

# Weekly liveness check of every Read/Code URL. Files/updates an issue on breakage.
# Never blocks commits — informational only.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check links
        id: check
        run: node scripts/check-links.mjs
        continue-on-error: true

      - name: Open or update issue on broken links
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔗 Broken links detected by weekly check"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
            echo "Commented on existing issue #$existing"
          else
            gh issue create --title "$title" --body-file link-report.md --label "link-rot" || \
            gh issue create --title "$title" --body-file link-report.md
          fi

      - name: Reflect failure
        if: steps.check.outcome == 'failure'
        run: |
          echo "::warning::Broken links found — see the tracking issue."
          exit 1
